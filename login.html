<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            margin-top: 100px;
            font-family: Arial;
        }
        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background: #00adb5;
            border: none;
            color: white;
        }
    </style>
</head>
<body>

<h2>Login</h2>

<form method="POST">
    <input type="text" name="username" placeholder="Username" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
</form>

</body>
</html>
